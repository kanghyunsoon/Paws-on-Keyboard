<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Ennoia와 Hugging Face 사이의 프록시 흐름</title>
  <desc id="desc">Ennoia가 프롬프트를 보내면 FastAPI 프록시가 Gradio 규격으로 변환하고 Hugging Face 결과를 이미지 URL로 반환한다.</desc>
  <rect width="1200" height="330" rx="24" fill="#f8f4ec"/>
  <text x="50" y="52" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#16243a">Ennoia의 프롬프트를 보내고 이미지 URL을 받는 흐름</text>
  <g font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <g transform="translate(50 100)">
      <rect width="250" height="150" rx="18" fill="#e8f0ff"/>
      <text x="24" y="48" font-size="21" font-weight="700" fill="#16243a">Ennoia</text>
      <text x="24" y="82" font-size="16" fill="#5b6678">prompt 또는 data[6]</text>
      <text x="24" y="112" font-size="16" fill="#5b6678">코드 함수 작성 불가</text>
    </g>
    <path d="M315 175 H405" stroke="#778398" stroke-width="3" fill="none"/>
    <path d="M392 164 L407 175 L392 186" stroke="#778398" stroke-width="3" fill="none"/>
    <g transform="translate(425 100)">
      <rect width="350" height="150" rx="18" fill="#fff0e8"/>
      <text x="24" y="48" font-size="21" font-weight="700" fill="#16243a">FastAPI Proxy</text>
      <text x="24" y="82" font-size="16" fill="#5b6678">입력 형식 변환 · Gradio 호출</text>
      <text x="24" y="112" font-size="16" fill="#5b6678">URL·파일·중첩 응답 해석</text>
    </g>
    <path d="M790 175 H880" stroke="#778398" stroke-width="3" fill="none"/>
    <path d="M867 164 L882 175 L867 186" stroke="#778398" stroke-width="3" fill="none"/>
    <g transform="translate(900 100)">
      <rect width="250" height="150" rx="18" fill="#e9f4eb"/>
      <text x="24" y="48" font-size="21" font-weight="700" fill="#16243a">Hugging Face</text>
      <text x="24" y="82" font-size="16" fill="#5b6678">Gradio Space</text>
      <text x="24" y="112" font-size="16" fill="#5b6678">/generate_image</text>
    </g>
    <path d="M900 278 H300" stroke="#0b5bd3" stroke-width="3" fill="none"/>
    <path d="M314 267 L299 278 L314 289" stroke="#0b5bd3" stroke-width="3" fill="none"/>
    <text x="486" y="310" font-size="16" font-weight="700" fill="#0b5bd3">{ status, image_url }</text>
  </g>
</svg>
