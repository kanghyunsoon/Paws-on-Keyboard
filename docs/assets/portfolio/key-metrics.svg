<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Paws on Keyboard 담당 범위 수치</title>
  <desc id="desc">AI 에이전트 4단계, 관광데이터 API 4종, 프록시 요청 형태 2종, 응답 계약 1개</desc>
  <rect width="1200" height="280" rx="24" fill="#f8f4ec"/>
  <text x="50" y="50" font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#16243a">담당 범위</text>
  <g font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <g transform="translate(50 82)">
      <rect width="255" height="150" rx="18" fill="#e8f0ff"/>
      <text x="24" y="62" font-size="42" font-weight="700" fill="#0b5bd3">4</text>
      <text x="24" y="96" font-size="19" font-weight="700" fill="#16243a">AI 에이전트</text>
      <text x="24" y="126" font-size="15" fill="#5b6678">Vision · Planner · Writer · Painter</text>
    </g>
    <g transform="translate(330 82)">
      <rect width="255" height="150" rx="18" fill="#e9f4eb"/>
      <text x="24" y="62" font-size="42" font-weight="700" fill="#4b8d59">4</text>
      <text x="24" y="96" font-size="19" font-weight="700" fill="#16243a">관광데이터 API</text>
      <text x="24" y="126" font-size="15" fill="#5b6678">동반 · 무장애 · 걷기길 · TourAPI</text>
    </g>
    <g transform="translate(610 82)">
      <rect width="255" height="150" rx="18" fill="#fff0e8"/>
      <text x="24" y="62" font-size="42" font-weight="700" fill="#d85f3b">2</text>
      <text x="24" y="96" font-size="19" font-weight="700" fill="#16243a">프록시 요청 형태</text>
      <text x="24" y="126" font-size="15" fill="#5b6678">prompt 객체 · Gradio data[6]</text>
    </g>
    <g transform="translate(890 82)">
      <rect width="255" height="150" rx="18" fill="#fff5d8"/>
      <text x="24" y="62" font-size="42" font-weight="700" fill="#b57a00">1</text>
      <text x="24" y="96" font-size="19" font-weight="700" fill="#16243a">이미지 응답 계약</text>
      <text x="24" y="126" font-size="15" fill="#5b6678">Ennoia가 읽는 image_url</text>
    </g>
